<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Ali Saleh | NFC Card</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#1e293b;
    --card:rgba(17,24,39,.72); --border:rgba(148,163,184,.18);
    --text:#f8fafc; --muted:#94a3b8; --faint:#64748b;
    --row:rgba(30,41,59,.65); --row-brd:rgba(148,163,184,.14);
    --a1:#38bdf8; --a2:#6366f1;
    --call:#22c55e; --search:#f59e0b; --pay:#a855f7; --insta:#ec4899;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 520px at 50% -10%,rgba(56,189,248,.18),transparent 60%),
      radial-gradient(900px 500px at 50% 120%,rgba(99,102,241,.20),transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
  }
  .card{
    width:min(100%,400px);padding:40px 28px 32px;position:relative;
    border:1px solid var(--border);border-radius:28px;
    background:var(--card);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .avatar{
    width:98px;height:98px;margin:0 auto 20px;border-radius:50%;overflow:hidden;
    background:#0b1220;box-shadow:0 14px 34px rgba(2,6,23,.5);
    outline:3px solid rgba(255,255,255,.14);outline-offset:2px;
  }
  .avatar{position:relative;overflow:hidden}
  .avatar img{display:block}
  h1{text-align:center;margin:0;font-size:26px;font-weight:800;letter-spacing:.2px}
  .role{text-align:center;color:var(--a1);font-weight:600;font-size:13px;margin:8px 0 16px;letter-spacing:.3px}
  .certs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 26px}
  .cert{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--row-brd);background:var(--row);font-size:11.5px;font-weight:600;color:var(--text)}
  .cert svg{width:17px;height:17px;flex:0 0 17px}
  .cert .g{display:inline-block;width:14px;height:14px;flex:0 0 14px;border-radius:50%;
    background:conic-gradient(#ea4335 0 25%,#fbbc05 25% 50%,#34a853 50% 75%,#4285f4 75% 100%);
    -webkit-mask:radial-gradient(circle 4px at 50% 50%,transparent 97%,#000 100%);
    mask:radial-gradient(circle 4px at 50% 50%,transparent 97%,#000 100%)}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 24px}
  .actions{display:grid;gap:16px}
  .action{
    display:flex;align-items:center;gap:16px;padding:18px 18px;
    border:1px solid var(--row-brd);border-radius:18px;background:var(--row);
    color:var(--text);text-decoration:none;
    transition:transform .12s ease,border-color .15s ease,background .15s ease;
  }
  @media(hover:hover){.action:hover{background:rgba(51,65,85,.7);border-color:rgba(148,163,184,.3);transform:translateY(-1px)}}
  .action:active{transform:scale(.985)}
  .action:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
  .ico{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:14px;background:rgba(15,23,42,.9)}
  .ico svg{width:21px;height:21px}
  .call .ico{color:var(--call)}.search .ico{color:var(--search)}.pay .ico{color:var(--pay)}.insta .ico{color:var(--insta)}
  .txt{display:flex;flex-direction:column;min-width:0}
  .label{font-weight:700;font-size:15px}
  .hint{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{margin-left:auto;color:var(--faint);font-size:22px;line-height:1}
  .foot{text-align:center;color:var(--faint);font-size:11px;margin:28px 0 0}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
